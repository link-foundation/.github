name: Credential integration
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run checks only.
        type: choice
        default: checks
        options: [checks]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: credential-integration
  cancel-in-progress: false
jobs:
  default:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./actions/resolve-github-token
        id: gh
      - name: Create disposable default-token pull request
        id: fixture
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: automation-fixture-default-${{ github.run_id }}
        run: python3 experiments/credential-fixture.py create
      - uses: ./actions/dispatch-checks
        id: dispatch
        with:
          ref: ${{ steps.fixture.outputs.branch }}
          workflows: fixture-checks.yml
          token: ${{ steps.gh.outputs.token }}
          triggers-workflows: ${{ steps.gh.outputs.triggers-workflows }}
      - name: Verify dispatched checks attach to the head commit
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: ${{ steps.fixture.outputs.branch }}
          FIXTURE_SHA: ${{ steps.fixture.outputs.sha }}
          RUN_URLS: ${{ steps.dispatch.outputs.run-urls }}
          EXPECT_EVENT: workflow_dispatch
        run: python3 experiments/credential-fixture.py verify
      - name: Close fixture PR and delete branch
        if: always() && steps.fixture.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: ${{ steps.fixture.outputs.branch }}
          FIXTURE_PR: ${{ steps.fixture.outputs.pr }}
        run: python3 experiments/credential-fixture.py cleanup
  token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./actions/resolve-github-token
        if: env.AUTOMATION_TOKEN != ''
        id: gh
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - name: Create disposable token pull request
        if: env.AUTOMATION_TOKEN != ''
        id: fixture
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: automation-fixture-token-${{ github.run_id }}
        run: python3 experiments/credential-fixture.py create
      - uses: ./actions/dispatch-checks
        if: env.AUTOMATION_TOKEN != ''
        id: dispatch
        with:
          ref: ${{ steps.fixture.outputs.branch }}
          workflows: fixture-checks.yml
          token: ${{ steps.gh.outputs.token }}
          triggers-workflows: ${{ steps.gh.outputs.triggers-workflows }}
      - name: Verify normal PR checks and dispatch no-op
        if: env.AUTOMATION_TOKEN != ''
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: ${{ steps.fixture.outputs.branch }}
          FIXTURE_SHA: ${{ steps.fixture.outputs.sha }}
          RUN_URLS: ${{ steps.dispatch.outputs.run-urls }}
          EXPECT_EVENT: pull_request
        run: python3 experiments/credential-fixture.py verify
      - name: Close fixture PR and delete branch
        if: always() && steps.fixture.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          FIXTURE_BRANCH: ${{ steps.fixture.outputs.branch }}
          FIXTURE_PR: ${{ steps.fixture.outputs.pr }}
        run: python3 experiments/credential-fixture.py cleanup
      - name: Report unavailable live token coverage
        if: env.AUTOMATION_TOKEN == ''
        run: echo 'Live AUTOMATION_TOKEN event testing was not exercised; configure the optional token to enable it.' >> "$GITHUB_STEP_SUMMARY"
