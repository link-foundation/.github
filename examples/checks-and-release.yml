name: Checks and release
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Checks only unless release is explicitly selected on the default branch.
        type: choice
        default: checks
        options: [checks, release]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the repository checks
        run: ./scripts/check.sh
  release:
    needs: checks
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: link-foundation/.github/actions/resolve-github-token@main
        id: gh
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          default-token: ${{ github.token }}
      - name: Publish an explicitly requested release
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: ./scripts/release.sh
